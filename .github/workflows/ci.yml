name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile --ignore-scripts --backend=copyfile
      - run: node scripts/build-node-pty.mjs
      - run: node scripts/check-node-pty.mjs
      - run: bun run build:cursor-sidecar
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run test

