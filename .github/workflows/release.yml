name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ARCHES: linux-x64

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile --ignore-scripts --backend=copyfile
      - run: node scripts/build-node-pty.mjs
      - run: node scripts/check-node-pty.mjs
      - name: Build web assets
        run: (cd apps/web && bunx vite build)
      - name: Build Node server bundle
        run: |
          mkdir -p dist
          bun build --target=node --external @cursor/sdk --define 'process.env.NODE_ENV=process.env.NODE_ENV' apps/server/src/index.ts --outfile dist/forge-server.js
          bun run build:kimi-guardian
      - name: Pack release
        id: pack
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$TAG-${SHA:0:7}"
          staging="$RUNNER_TEMP/forge-linux-x64"
          rm -rf "$staging"
          mkdir -p "$staging/apps/server/src" "$staging/apps/drizzle" "$staging/web"
          cp dist/forge-server.js "$staging/apps/server/src/index.js"
          cp dist/kimi-guardian.js "$staging/apps/server/src/kimi-guardian.js"
          cp -R apps/server/drizzle/. "$staging/apps/drizzle/"
          cp -R apps/web/dist/. "$staging/web/"
          cp apps/server/package.json "$staging/apps/server/package.json"
          bun scripts/build-cursor-sidecar.ts "$staging/apps/server/src/cursor-sidecar"
          # Pack the verified owned build beside the bundle's native loader.
          mkdir -p "$staging/apps/server/src/build/Release"
          cp apps/server/node_modules/node-pty/build/Release/pty.node "$staging/apps/server/src/build/Release/"
          cp apps/server/node_modules/node-pty/build/Release/forge-owned-build.json "$staging/apps/server/src/build/Release/"
          cp apps/server/node_modules/node-pty/LICENSE "$staging/apps/server/src/build/Release/node-pty.LICENSE"
          if [ -f apps/server/node_modules/node-pty/build/Release/spawn-helper ]; then
            cp apps/server/node_modules/node-pty/build/Release/spawn-helper "$staging/apps/server/src/build/Release/"
          fi
          node -e 'const fs=require("node:fs"); const file=process.argv[1]; const pkg=JSON.parse(fs.readFileSync(file,"utf8")); pkg.version=process.argv[2]; fs.writeFileSync(file, JSON.stringify(pkg)+"\n")' "$staging/apps/server/package.json" "$version"
          test -s "$staging/web/index.html"
          bun run --filter forge-client build
          (cd packages/forge-client && bun pm pack --destination "$GITHUB_WORKSPACE/dist")
          client_tarball="$(find dist -maxdepth 1 -type f -name 'forge-client-*.tgz' -print -quit)"
          test -n "$client_tarball"
          mv "$client_tarball" "dist/forge-client-${version}.tgz"
          tar -C "$RUNNER_TEMP" -czf "dist/forge-linux-x64.tar.gz" forge-linux-x64
          (cd dist && sha256sum forge-linux-x64.tar.gz "forge-client-${version}.tgz" > checksums.txt)
          printf 'version=%s\nclient_tarball=dist/forge-client-%s.tgz\n' "$version" "$version" >> "$GITHUB_OUTPUT"
      - name: Extracted terminal smoke
        run: node scripts/terminal-release-smoke.mjs dist/forge-linux-x64.tar.gz "$RUNNER_TEMP/forge-terminal-smoke"
      - name: Packed native smoke
        env:
          FORGE_VERSION: ${{ steps.pack.outputs.version }}
        run: node scripts/packed-native-smoke.mjs "$RUNNER_TEMP/forge-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-linux-x64
          path: |
            dist/forge-linux-x64.tar.gz
            dist/forge-client-*.tgz
            dist/checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CLIENT_TARBALL: ${{ steps.pack.outputs.client_tarball }}
        run: |
          gh release create "$TAG" \
            dist/forge-linux-x64.tar.gz \
            "$CLIENT_TARBALL" \
            dist/checksums.txt \
            --generate-notes \
            --title "$TAG" \
            --notes 'Forge uses the Node 24 build-on-host fallback. The tarball contains the server bundle and web assets.'
